name: Deploy binderwish.com

on:
  push:
    branches: [main]
  # Daily rebuild so new sets and TCGPlayer prices stay current.
  # tcgcsv.com refreshes its TCGPlayer mirror around 20:00 UTC.
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the nightly card-matching check keeps one issue up to date

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # binderwish.com is hosted on Cloudflare Pages; both are repository secrets
      # (Settings → Secrets and variables → Actions).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `prebuild` runs scripts/sync-tcgplayer.mjs to refresh the TCGPlayer catalog.
      # No 404.html on purpose: Cloudflare Pages then serves the app for every path.
      - run: npm run build
        env:
          # Form endpoint for the "Get them printed" waitlist (Settings → Secrets and
          # variables → Actions → Variables). Unset = the button stays hidden.
          VITE_WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
          # Set the ACCOUNTS repo variable to "on" to show sign-in (needs custom SMTP in Supabase).
          VITE_ACCOUNTS: ${{ vars.ACCOUNTS }}
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project create binderwish --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=binderwish --branch=main --commit-dirty=true

      # Supabase pauses free projects after about a week with no activity, which
      # would break sign-in and sync. The daily build touches both the sign-in
      # service and the database so the project never goes idle. Uses the same
      # public (publishable) key the website ships with; never fails the deploy.
      - name: Keep Supabase active
        continue-on-error: true
        env:
          SUPABASE_URL: https://tbissnuzjfjuvjwtseza.supabase.co
          SUPABASE_KEY: sb_publishable_d9GuSWBWrka2KDNgUF1N0w_e0cAsznX
        run: |
          curl -sS -o /dev/null -w "auth: %{http_code}\n" "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_KEY"
          curl -sS -o /dev/null -w "database: %{http_code} (401 is expected — the request still reaches it)\n" "$SUPABASE_URL/rest/v1/collections?select=user_id&limit=1" -H "apikey: $SUPABASE_KEY"

      # Nightly card-matching check (scripts/check-matching.mjs): runs the site's own
      # card ↔ TCGPlayer matching over every Pokémon and Lorcana set and reports
      # duplicates, wrong-looking matches and unmatched cards in new sets. Keeps one
      # open issue labelled "card-matching" up to date (a comment when the findings
      # change, so GitHub emails you) and closes it when everything checks out.
      # Skipped on pushes; never fails the deploy.
      - name: Check card matching
        id: matching
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          node scripts/check-matching.mjs --out matching-report.md
          cat matching-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report card matching
        if: github.event_name != 'push' && steps.matching.outputs.problems != '' && steps.matching.outputs.problems != 'error'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.matching.outputs.problems }}
        run: |
          gh label create card-matching --color D93F0B --description "Nightly card-matching check" --force
          issue=$(gh issue list --label card-matching --state open --json number --jq '.[0].number // empty')
          if [ "$PROBLEMS" = "0" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "All clear — last night's check found no problems."; fi
            exit 0
          fi
          title="Card matching: $PROBLEMS problem(s) found"
          if [ -z "$issue" ]; then
            gh issue create --title "$title" --label card-matching --body-file matching-report.md
            exit 0
          fi
          # Compare without the first line (it carries the date).
          old=$(gh issue view "$issue" --json body --jq .body | tail -n +2)
          new=$(tail -n +2 matching-report.md)
          if [ "$old" != "$new" ]; then
            gh issue edit "$issue" --title "$title" --body-file matching-report.md
            gh issue comment "$issue" --body "The findings changed — now $PROBLEMS problem(s). The issue description has the latest report."
          fi
